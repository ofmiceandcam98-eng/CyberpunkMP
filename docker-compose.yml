services:
  # The deployment's own network identity. This sidecar joins the tailnet the players
  # use, so a server is reachable at its OWN stable Tailscale address wherever it runs -
  # the network node travels with the deployment instead of belonging to whatever
  # machine happens to host it. TS_AUTHKEY comes from .env on first start and is
  # ignored once state exists (TS_AUTH_ONCE), so a redeploy never re-registers.
  # Without TS_AUTHKEY the sidecar idles unauthenticated and the game still serves
  # on the LAN ports below - a checkout with no tailnet still works.
  tailscale:
    image: tailscale/tailscale:stable
    container_name: cyberpunkmp-tailscale
    restart: unless-stopped
    hostname: nco-server
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking: no /dev/net/tun, no NET_ADMIN, works unprivileged on any
      # host. Inbound tailnet traffic reaches sockets in this network namespace - which
      # is exactly where the game server's sockets live (see network_mode below).
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
    volumes:
      # Node identity. Keep it or the server gets a new address on every recreate.
      - ./tailscale-state:/var/lib/tailscale
    ports:
      # Game traffic, published on the host as before. GameNetworkingSockets is UDP;
      # the same port serves the web/admin API over TCP. Published HERE because the
      # server container shares this network namespace.
      - "${CYBERPUNKMP_PORT:-11778}:11778/udp"
      - "${CYBERPUNKMP_PORT:-11778}:11778/tcp"
      # The coordination feed, when the coord-api service below is enabled. Published
      # unconditionally because ports belong to whoever owns the namespace, and this
      # sidecar does. With the service switched off nothing listens behind it, which
      # costs nothing - a published port with no listener simply refuses connections.
      - "${NCO_COORD_PORT:-11780}:11780/tcp"

  server:
    build:
      context: .
      args:
        # Build parallelism - see the ARG in the Dockerfile. Override per host in .env
        # (BUILD_JOBS=1 for constrained machines) without touching tracked files.
        BUILD_JOBS: ${BUILD_JOBS:-2}
    image: cyberpunkmp-server
    container_name: cyberpunkmp-server
    restart: unless-stopped

    # The game server lives inside the sidecar's network namespace: one set of sockets
    # answers the tailnet address, the LAN, and localhost alike.
    network_mode: service:tailscale
    depends_on:
      - tailscale

    # Release builds refuse to start without these - see WebApi.cs.
    environment:
      CYBERPUNKMP_ADMIN_USERNAME: ${CYBERPUNKMP_ADMIN_USERNAME:?set this in .env}
      CYBERPUNKMP_ADMIN_PASSWORD: ${CYBERPUNKMP_ADMIN_PASSWORD:?set this in .env}
      # The world clock's real-time mode (/time real) mirrors THIS timezone - the
      # crew's community time is US Central. DST comes free with tzdata.
      TZ: ${TZ:-America/Chicago}
      # The server's native HTTPS (Discord verification, server list) links a statically
      # built OpenSSL whose baked-in CA path is the BUILD machine's package directory -
      # which does not exist in this image, so every TLS connection fails verification.
      # OpenSSL honors this override; the bundle ships with the runtime image.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

    volumes:
      # Config is created on first run - keep it so settings survive a rebuild.
      - ./config:/app/config
      # Server-side plugins.
      - ./plugins:/app/plugins
      # Logs, so you can read them without entering the container.
      - ./logs:/app/logs

    # The server needs a console attached: without one, Swan does not register its
    # ConsoleLogger and WebApi's Logger.UnregisterLogger<ConsoleLogger>() throws
    # "The logger is not registered" on startup.
    tty: true
    stdin_open: true

  # The coordination feed the assistants post to.
  #
  # The last thing still tied to one person's desktop. Everything else moved to this
  # deployment; this did not, because nothing ever described how to run it here. So it
  # only existed while Cam's PC was on - and when it was off, posts from the other side
  # did not queue, they were simply never made. The feed's history has a two-day hole in
  # it for exactly that reason, covering seventeen releases.
  #
  # OFF BY DEFAULT, via the profile. There must be exactly one of these: it owns the
  # participant keys and the history, and a second copy on the test deployment would be a
  # second set of both. Start it deliberately, on one host:
  #
  #     docker compose --profile coord up -d
  #
  # An ordinary `docker compose up -d` ignores it entirely.
  coord-api:
    profiles: ["coord"]
    image: node:22-alpine
    container_name: nco-coord-api
    restart: unless-stopped

    # No build, no package.json, no npm install: the service imports nothing but Node
    # built-ins. Worth stating because the absence of a Dockerfile here looks like an
    # omission rather than the point.
    working_dir: /app
    command: ["node", "code/coord-api/server.js"]

    # Same namespace as the game server, so the feed answers on the deployment's own
    # tailnet address rather than on whichever machine happens to be hosting.
    network_mode: service:tailscale
    depends_on:
      - tailscale

    environment:
      # State kept outside the source mount, so the source can stay read-only and the
      # keys and history are one obvious directory to back up.
      NCO_COORD_DATA: /data
      # What the service TELLS people to connect to.
      #
      # It discovers this by scanning local interfaces for a 100.64/10 address. That
      # works on a normal machine and CANNOT work here: the sidecar runs userspace
      # networking (TS_USERSPACE above), which deliberately creates no tun device, so
      # there is no interface carrying the tailnet address to find. Inbound traffic
      # still arrives - it reaches sockets in this namespace - but nothing in the
      # namespace can see what address it arrived on.
      #
      # So detection fails by design here, and it falls back to advertising loopback,
      # which is right only for whoever is already on the host.
      #
      # Deliberately NOT the required `:?` form. Compose interpolates every service's
      # environment before it applies profiles, so a required variable here fails a plain
      # `docker compose up -d` on a deployment that never starts this service at all -
      # which would have broken the test server's deploys over a service it does not run.
      # The service warns loudly for itself at startup instead.
      NCO_COORD_HOST: ${NCO_COORD_HOST:-}

    volumes:
      # Read-only: the service has no business rewriting its own source.
      - ./code/coord-api:/app/code/coord-api:ro
      # It publishes a digest for the launcher to read. Writable.
      - ./publish:/app/publish
      # The participant keys and the append-only history. THIS is the directory that has
      # to be carried across from the old host - see docs/COORD-API-MIGRATION.md.
      - ./coord-data:/data
