name: Build linux

on:
  pull_request:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'publish/**'
      - 'tools/**'
      - 'code/launcher-lite/**'
      - 'docs/**'
      - '**.md'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        arch: [x64]
        mode: [release]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    # A full run takes ~15 minutes. Without a ceiling, a wedged runner (one hung for 2h
    # on apt-get update, 2026-08-18) squats in the queue until GitHub's 6-hour kill.
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    # Every git clone this job makes beyond the checkout - xmake-repo, build-artifacts,
    # package sources, submodules - is anonymous by default, and GitHub 403-rate-limits
    # anonymous clones from Actions runner IPs (killed 4 consecutive runs, 2026-08-21;
    # retrying just hit the same wall). Rewriting both URL forms to carry the run's own
    # token moves every clone into the authenticated pool.
    - name: 'Authenticate git clones to GitHub'
      run: |
        git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
        git config --global --add url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"

    - name: 'Checkout submodules'
      run: |
        git submodule sync --recursive
        git submodule update --init --force --recursive --depth=1

    # Install dependencies
    - name: 'Update apt repositories'
      run: sudo apt-get update

    # Install pnpm for better disk/cache performance
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    # Install xmake
    - name: 'Setup xmake'
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: branch@master

    # Update xmake repository (in order to have the file that will be cached).
    # Retried for transient mirror hiccups; the 403 class is fixed by the auth step above.
    - name: 'Update xmake repository'
      run: |
        for i in 1 2 3; do
          xmake repo --update && exit 0
          echo "xmake repo update failed (attempt $i) - retrying in 30s"
          sleep 30
        done
        exit 1

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9

    # Setup compilation mode and install project dependencies
    - name: 'Configure xmake and install dependencies'
      continue-on-error: true
      run: timeout 30m xmake config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --yes

    # Build the server
    - name: Build
      run: xmake -y

  # The raw build above proves the code compiles on Linux; this proves the actual
  # deployment artifact builds - same Dockerfile the servers pull and run. Green here
  # means a push to the deployed branch will not brick the self-updating servers.
  container:
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the server container
        run: docker build --build-arg BUILD_JOBS=4 .
