name: 'Build windows'

on:
  pull_request:
  push:
    branches:
      - main
      - dev

# NOTE: pnpm doesn't support command 'ci' for now.
#
#env:
#  IS_CI: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
        arch: [x64]
        mode: [releasedbg]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    # Same hang ceiling as the Linux workflow: a healthy run finishes well inside this;
    # a wedged runner must not squat until GitHub's 6-hour kill.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 'Checkout submodules'
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      # The v2 namespace deliberately orphans every older cache: restore-keys pulls the
      # nearest PREVIOUS cache on a key miss, which resurrected a package dir built by
      # xmake 2.9.6 against pre-pin dependency resolves - and header-only packages then
      # failed to install instantly, with the real cause invisible from the log.
      - name: 'Cache xmake dependencies'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-packages-v2-${{ hashFiles('**/xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-packages-v2-

      # Install pnpm for better disk/cache performance
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Fix long path issue
      - name: Setup pnpm
        run: pnpm config set virtual-store-dir-max-length=50

      # Install xmake - the SAME version every developer machine pins (CONTRIBUTING
      # documents the toolchain pins as load-bearing). CI ran 2.9.6 while the project
      # moved to 3.1.0, and current package recipes assume the newer xmake.
      - name: 'Setup xmake'
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.0 # Sync with cache key too
          actions-cache-folder: '.xmake-cache' # This doesn't cache dependencies, only xmake itself
          actions-cache-key: ${{ runner.os }}-xmake-cache-3.1.0

      # NO --vs_sdkver here, deliberately. The SDK pin is a DEV-MACHINE necessity (those
      # boxes install exactly one SDK); GitHub's runner images ship whichever SDKs they
      # ship and rotate them without notice - pinning any version eventually makes the
      # compiler unable to find windows.h/stdio.h at all, which is how this workflow
      # died twice (19041 first, then 22621). Auto-detection tracks the image.
      - name: 'Configure xmake and install dependencies'
        run: xmake config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --yes

      # Build the game
      - name: 'Build with xmake'
        run: xmake -y

      # Install node
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: |
            code/launcher/pnpm-lock.yaml
            code/launcher/electron/pnpm-lock.yaml

      - name: 'Generate build'
        run: xmake install -o distrib

      - name: 'Package build'
        run: xmake pack

      - name: 'Upload Artifact'
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/xpack/Cyberpunk Multiplayer/Artifacts.zip
