syntax = "proto3";

package client;

import "common.proto";

message AuthenticationRequest {
    string username = 1;
    string token = 2;
    uint64 client_protocol = 3;
    uint64 server_protocol = 4;

    // Which build this DLL actually is - the git commit baked in at compile time.
    // The protocol hashes above say "same wire shape"; this says WHICH build, so a
    // denial can finally name the stale side instead of "Invalid protocol version!".
    string build_stamp = 5;

    // What the launcher verified this installation against, passed through the game's
    // launch arguments. Empty when the client was started without the launcher - the
    // server decides what that means (during migration: nothing).
    string manifest_version = 6;

    // The launcher's attestation that every required component matched the manifest -
    // 64 lowercase hex chars of SHA-256 over manifest-declared identities only (the
    // canonical string is defined in docs/MANIFEST-ARCHITECTURE.md 7.2). An accident
    // detector, not proof: a hostile client can echo it, a half-updated one cannot.
    string install_digest = 7;

    // Unmanaged things the launcher found, type-prefixed ("plugin:FlightControl",
    // "archive:weather.archive", "script:foo.reds", "marker:cyber_engine_tweaks").
    // Client-supplied and therefore advisory - it exists to stop accidents, never
    // adversaries, and the server policy that reads it says so.
    repeated string unmanaged = 8;

    // Checked only when the server config sets one. Carried here rather than in a
    // second round trip because the connection is refused before a player entity
    // exists either way.
    string password = 9;
}

message SpawnCharacterRequest {
    common.Vector3 position = 1;
    float rotation = 2;
    bool is_player = 3;
    uint64 cookie = 4;
    // TweakDBIDs as raw numbers, NOT their names.
    //
    // These used to be strings produced by TDBID.ToStringDEBUG, which needs TweakDB's
    // debug name table. That table is stripped from release builds of the game, so on
    // 2.31 every name came back empty, every item serialised blank, and remote players
    // appeared with no clothes or weapons. The number is the identity; the name was only
    // ever for humans reading logs.
    repeated uint64 equipment = 5;
    bytes ccstate = 6;
}

// Saves the player's appearance as their multiplayer character.
//
// Sent when the character creator closes, NOT on every spawn - the spawn message carries
// an appearance too, but that one describes whoever the loaded save happens to contain.
// This one is a deliberate "this is me", and it is the only one the server stores.
message Attribute {
    uint32 type = 1;
    int32 value = 2;
}

message Perk {
    uint32 type = 1;
    int32 level = 2;
}

message Proficiency {
    uint32 type = 1;
    int32 level = 2;
}

message ItemStack {
    uint64 id = 1;
    uint32 quantity = 2;
}

message SaveCharacterRequest {
    // The game's own CharacterCustomizationState, serialised. The server stores it
    // opaquely and hands the same bytes back, so a game patch changing the format needs
    // no server change.
    bytes ccstate = 1;

    // The character's name in the world, which is not the player's Discord name.
    string name = 2;

    // Kept out of the blob because the server needs it without parsing: it decides which
    // puppet record other clients spawn for this player.
    bool is_male = 3;

    // What the character is carrying, so possessions belong to the server rather than to
    // whatever save the player happened to load.
    //
    // Raw TweakDBIDs, like the equipment list above, for the same reason: the server has
    // no need to know what an item IS in order to remember that you have it, and a server
    // that understood item records would need updating every game patch.
    repeated ItemStack inventory = 4;

    // Eddies. A balance is a number - modelling it as a stack of one item is how you get
    // somebody duplicating money by counting wrong.
    int64 money = 5;

    // Skills, street cred and level - all gamedataProficiencyType entries.
    repeated Proficiency proficiencies = 6;

    // The five attributes, and every perk bought.
    repeated Attribute attributes = 8;
    repeated Perk perks = 9;

    // Owned vehicles, by the game's own vehicle name rather than a TweakDBID - see the
    // note in CharacterRecord. EnablePlayerVehicle takes a string, and an id cannot be
    // turned back into one on 2.31.
    repeated string vehicles = 10;

    // True when the save happened by itself - the ninety-second timer, or leaving.
    //
    // The server confirms a save in chat, which is right when somebody asked for one and
    // is noise when nobody did. Without this the confirmation appeared every ninety
    // seconds forever, burying actual chat under a message about something the player did
    // not do and cannot stop.
    bool automatic = 7;
}


message MoveEntityRequest {
    bool unreliable = 1000; // This is just a tag to indicate that this message is unreliable
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    float speed = 4;
    common.Vector3 full_rotation = 5;
    uint64 tick = 6;

    // Which grant of authority this movement belongs to (see NotifyAuthorityAssigned).
    //
    // This message is unreliable and unordered across an authority handoff, so packets
    // from the PREVIOUS simulator can arrive after the transfer. The epoch names the
    // grant; the server drops anything stale, silently - that race is expected, not an
    // attack. Entities that never change hands (player puppets) stay at zero.
    uint32 epoch = 7;

    // What the sender's own game says they are DOING, not just where they are.
    // gamePSMLocomotionStates (Default=0 Crouch=1 Sprint=2 Jump=5 Slide=10
    // CrouchSprint=12 ...) and gamePSMUpperBodyStates (Aim=6). Measured speed lags
    // and quantizes; these are read straight off the PlayerStateMachine blackboard,
    // so remote puppets can be told to sprint/crouch/aim the way the sender actually
    // is. Zero (Default) when unavailable - e.g. seated in a vehicle.
    uint32 locomotion = 8;
    uint32 upper_body = 9;
}

message EnterVehicleRequest {
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    uint64 vehicle_id = 4;
    uint64 sit_id = 5;
    uint64 remote_vehicle_id = 6;
}

message ExitVehicleRequest {
    uint64 id = 1;

    // Which mount this exit is about. A seat swap is exit+enter within a millisecond,
    // and if the server applies the enter first, the trailing exit used to remove the
    // NEW seat - emptying a car whose driver believes he is driving it, whereupon it
    // was destroyed under him. Naming the vehicle and seat lets the server recognise
    // that stale exit (it no longer matches the current attachment) and drop it.
    uint64 vehicle_id = 2;
    uint64 sit_id = 3;
}

message ChatMessageRequest {
    string message = 1;
}

// "I was downed - where do I get up?"
//
// Carries nothing on purpose. The client is not telling the server where to put it, only
// that it needs putting somewhere; the server owns the respawn point. A client that could
// name its own destination could teleport anywhere by claiming to have died.
message RespawnRequest {
}

message RpcCall {
    uint32 id = 1;
	bytes arguments = 2;
}

// "What I look like right now" - sent while already in the world.
//
// SaveCharacterRequest is the wrong message for this. It means "this is who this character
// IS": it carries possessions, money and progression, it is what the character creator
// closing produces, and the server treats it as a full identity write. Changing a jacket is
// none of those things, and routing it through that path would mean a wardrobe visit
// rewriting somebody's inventory record.
//
// Appearance only ever reached other players at spawn - NotifyCharacterLoad and nothing
// else - so a player who changed clothes stayed dressed the way they arrived until everyone
// watching rejoined. This is the message that was missing.
message UpdateAppearanceRequest {
    // Equipped items, as raw TweakDBIDs. Same reasoning as everywhere else: the server does
    // not need to know what a garment IS in order to relay which ones somebody has on.
    repeated uint64 equipment = 1;

    // The customization blob, when it changed too - a ripperdoc visit rather than a
    // wardrobe one. Optional, because most updates are clothing alone and the blob is 9KB.
    bytes ccstate = 2;
}

// Delete this account's character. Permanently.
//
// NO ID FIELD, deliberately. The server derives whose character this is from the
// authenticated connection, so "delete mine" cannot be spelled "delete theirs" - the one
// request where getting that wrong is unrecoverable rather than merely wrong.
//
// The confirmation belongs on the client, in front of the person losing the character. By
// the time this message exists they have already answered it.
message DeleteCharacterRequest {
}

message Protocol {
    oneof content {
        AuthenticationRequest authentication_request = 1;
        SpawnCharacterRequest spawn_character_request = 2;
        MoveEntityRequest move_entity_request = 3;
        ChatMessageRequest chat_message_request = 4;
        RpcCall rpc_call = 5;
        EnterVehicleRequest enter_vehicle_request = 6;
        ExitVehicleRequest exit_vehicle_request = 7;
        RespawnRequest respawn_request = 8;
        SaveCharacterRequest save_character_request = 9;
        UpdateAppearanceRequest update_appearance_request = 10;
        DeleteCharacterRequest delete_character_request = 11;
    }
}