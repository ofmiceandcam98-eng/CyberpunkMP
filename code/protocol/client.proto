syntax = "proto3";

package client;

import "common.proto";

message AuthenticationRequest {
    string username = 1;
    string token = 2;
    uint64 client_protocol = 3;
    uint64 server_protocol = 4;
}

message SpawnCharacterRequest {
    common.Vector3 position = 1;
    float rotation = 2;
    bool is_player = 3;
    uint64 cookie = 4;
    // TweakDBIDs as raw numbers, NOT their names.
    //
    // These used to be strings produced by TDBID.ToStringDEBUG, which needs TweakDB's
    // debug name table. That table is stripped from release builds of the game, so on
    // 2.31 every name came back empty, every item serialised blank, and remote players
    // appeared with no clothes or weapons. The number is the identity; the name was only
    // ever for humans reading logs.
    repeated uint64 equipment = 5;
    bytes ccstate = 6;
}

// Saves the player's appearance as their multiplayer character.
//
// Sent when the character creator closes, NOT on every spawn - the spawn message carries
// an appearance too, but that one describes whoever the loaded save happens to contain.
// This one is a deliberate "this is me", and it is the only one the server stores.
message SaveCharacterRequest {
    // The game's own CharacterCustomizationState, serialised. The server stores it
    // opaquely and hands the same bytes back, so a game patch changing the format needs
    // no server change.
    bytes ccstate = 1;

    // The character's name in the world, which is not the player's Discord name.
    string name = 2;

    // Kept out of the blob because the server needs it without parsing: it decides which
    // puppet record other clients spawn for this player.
    bool is_male = 3;
}

message MoveEntityRequest {
    bool unreliable = 1000; // This is just a tag to indicate that this message is unreliable
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    float speed = 4;
    common.Vector3 full_rotation = 5;
    uint64 tick = 6;

    // Which grant of authority this movement belongs to (see NotifyAuthorityAssigned).
    //
    // This message is unreliable and unordered across an authority handoff, so packets
    // from the PREVIOUS simulator can arrive after the transfer. The epoch names the
    // grant; the server drops anything stale, silently - that race is expected, not an
    // attack. Entities that never change hands (player puppets) stay at zero.
    uint32 epoch = 7;
}

message EnterVehicleRequest {
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    uint64 vehicle_id = 4;
    uint64 sit_id = 5;
    uint64 remote_vehicle_id = 6;
}

message ExitVehicleRequest {
    uint64 id = 1;
}

message ChatMessageRequest {
    string message = 1;
}

// "I was downed - where do I get up?"
//
// Carries nothing on purpose. The client is not telling the server where to put it, only
// that it needs putting somewhere; the server owns the respawn point. A client that could
// name its own destination could teleport anywhere by claiming to have died.
message RespawnRequest {
}

message RpcCall {
    uint32 id = 1;
	bytes arguments = 2;
}

message Protocol {
    oneof content {
        AuthenticationRequest authentication_request = 1;
        SpawnCharacterRequest spawn_character_request = 2;
        MoveEntityRequest move_entity_request = 3;
        ChatMessageRequest chat_message_request = 4;
        RpcCall rpc_call = 5;
        EnterVehicleRequest enter_vehicle_request = 6;
        ExitVehicleRequest exit_vehicle_request = 7;
        RespawnRequest respawn_request = 8;
        SaveCharacterRequest save_character_request = 9;
    }
}