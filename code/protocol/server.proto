syntax = "proto3";

package server;

import "common.proto";

message Settings {
    uint32 update_rate = 1;
}

// Enough to draw one row of a character selector, and deliberately no more.
//
// Not the whole record: the appearance blob is 9KB and nothing on a selection screen needs
// an inventory. What a player needs to recognise their character is the name and how far
// they got.
message CharacterSummary {
    string id = 1;
    string name = 2;
    int32 level = 3;

    // Has this character ever stood in the world? One that was created but never spawned
    // goes to the configured server spawn; one that has been played resumes where the
    // server last recorded it. Here so the selector can say "new", not to be acted on -
    // the server decides where anybody lands.
    bool spawned_before = 4;
}

message AuthenticationResponse {
    bool success = 1;
    string error = 2;
    Settings settings = 3;

    // What characters this ACCOUNT has, decided by the server and sent unasked.
    //
    // The client must never answer "do I have a character" for itself. It has a Cyberpunk
    // save sitting on disk that looks exactly like an answer and is not one - that save is
    // the world template, not anybody's identity. The account owns the character, the
    // server owns the account, and this is the server saying so before the client has a
    // chance to guess.
    //
    // Carried on the authentication reply rather than a message of its own: it is known
    // the moment the account is, and a second round trip is a window in which the client
    // has been authenticated but does not yet know who it is playing.
    //
    // A LIST, even though the rule today is one character per account.
    //
    // Not because slots are wanted now - they are explicitly not - but because "how many
    // characters does this account have" is answered in three places once it ships: here,
    // the selector that draws it, and everything that reads the selection. Flat singular
    // fields make all three assume the answer is one, and the day that changes every one
    // of them changes with it. A list of length one costs nothing today and is the whole
    // difference later. Empty means no character, which is a state the selector must
    // handle anyway.
    repeated CharacterSummary characters = 4;

    // Structured refusal, so the client can act on WHY instead of pattern-matching the
    // error string. Values are EDenialCode in GameServer.h: 0 none, 1 protocol mismatch,
    // 2 client outdated, 3 manifest mismatch, 4 digest mismatch, 5 discord expired,
    // 6 not a member, 7 discord unreachable, 8 banned, 9 server full, 10 unmanaged
    // blocked, 11 wrong password. The error string above stays the human sentence.
    uint32 denial_code = 5;

    // On manifest/digest denials: the manifestVersion the server wanted, so the popup
    // can say exactly which update to fetch instead of "your installation is wrong".
    string required_manifest = 6;
}

message Attribute {
    uint32 type = 1;
    int32 value = 2;
}

message Perk {
    uint32 type = 1;
    int32 level = 2;
}

/**
 * The server correcting a player's balance.
 *
 * Needed because money moves in BOTH directions and the client is the one holding it. The
 * server can decide a purchase happened, but if it only edits its own record the client
 * still has the eddies in game - and the next ninety-second autosave reports that figure
 * back, overwriting the deduction. The money would be spent and then unspent, silently,
 * every single time.
 *
 * So a balance change is pushed, the client applies the difference, and the next capture
 * reports a figure that already agrees.
 */
message NotifyMoney {
    int32 balance = 1;
    string reason = 2;
}

/**
 * Move one player's journal entry to done.
 *
 * Sent to a single client rather than broadcast: only the game that owns a journal can
 * change it, and one player skipping a quest is not an event the rest of the server needs
 * narrated at them.
 *
 * Carries the quest by NAME, uninterpreted by the server - the same principle as items and
 * appearance. A server that understood quest identifiers would need updating every patch,
 * and it has no need to know what a quest IS in order to relay an admin's instruction.
 */
message NotifyQuestSkip {
    string quest = 1;
}

message WorldFact {
    string name = 1;
    int32 value = 2;
}

message Proficiency {
    uint32 type = 1;
    int32 level = 2;
}

message ItemStack {
    uint64 id = 1;
    uint32 quantity = 2;
}

message SpawnCharacterResponse{
    uint64 id = 1;
    uint64 cookie = 2;

    // What this character owns, restored from the server's record.
    //
    // Sent with the spawn rather than as a later message so there is no window where the
    // player is standing in the world holding whatever their local save gave them. The
    // client clears what the save provided and applies this instead.
    repeated ItemStack inventory = 3;
    int64 money = 4;

    // False when the server has never stored possessions for this character - a character
    // made before this existed, or one whose first save has not happened yet. The client
    // must then leave the save's contents alone rather than emptying somebody's pockets on
    // the strength of an empty record.
    bool has_possessions = 5;

    repeated Proficiency proficiencies = 6;

    repeated Attribute attributes = 7;
    repeated Perk perks = 8;
    repeated string vehicles = 10;

    // Quest facts the server wants set on this client.
    //
    // Most locked doors in Night City are gated on a quest fact - the device code checks
    // one before deciding whether it opens. Setting them is how a server says "this place
    // is open here", without touching quest state or pretending a quest was completed.
    //
    // Sent with the spawn so the world is already the server's version by the time
    // somebody is standing in it.
    repeated WorldFact facts = 9;
}


message NotifyCharacterLoad {
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    bool is_player = 4;
    // Raw TweakDBIDs - see the matching field in client.proto for why these are not names.
    repeated uint64 equipment = 5;
    bytes ccstate = 6;

    // Who this is.
    //
    // Without it the client has no idea, and the nameplate falls back to whatever the
    // TweakDB record it was built from is called - which is why every remote player
    // showed up as "Panam". The server is the only thing that knows the real name, since
    // it is the half that talked to Discord.
    string username = 7;

    // Which body to build - SERVER-GRANTED, like the name. Receivers used to re-derive
    // gender by parsing the appearance blob with a silent fall-back to male, and a
    // parse hiccup spawned a female character as the male mannequin (live, 2026-08-21:
    // "cam is able to see me but as a character and is a male my character is a
    // female"). The server stores the explicit flag at save time; now it says so.
    bool is_male = 9;

    // Present only for SERVER-DECLARED characters (NPCs an admin placed): the exact
    // TweakDB record to build them from - a specific person, not a player mannequin.
    // Absent for players, whose record is derived from their appearance data.
    string puppet_record = 8;
}

message NotifyVehicleLoad {
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    uint64 tweak_id = 4;
}

// DEPRECATED - subsumed by NotifyAuthorityAssigned. Never sent any more; kept so the
// oneof numbering stays stable. Remove once nothing has referenced it for a release.
message NotifyVehicleControlAssigned {
    uint64 vehicle_id = 1;
}

// This client is now the simulator for an entity.
//
// Authority on the server is entity parentage - that has always been the case, and the
// server refuses movement from anyone but the owner. What was missing is telling the
// CLIENTS when it changes hands: an ex-driver's machine kept simulating a car it no
// longer owned and fought the interpolation, which passengers felt as bouncing.
//
// On receipt: wake the entity's local physics, start streaming MoveEntityRequest for it,
// and stamp every one with this epoch. The epoch orders grants across handoffs - it only
// increments when the owner actually changes, so a re-announcement to the same owner
// does not invalidate movement already in flight.
message NotifyAuthorityAssigned {
    uint64 entity_id = 1;
    uint32 epoch = 2;
}

// This client is no longer the simulator for an entity.
//
// The missing half described above. On receipt: put the entity back under remote
// control (kinematic, interpolated) and stop streaming movement for it. Everyone else
// hears nothing - they were interpolating and keep interpolating.
message NotifyAuthorityRevoked {
    uint64 entity_id = 1;
    uint32 epoch = 2;
}

message NotifyVehicleEnter {
    uint64 vehicle_id = 1;
    uint64 character_id = 2;
    uint64 sit_id = 3;
}

message NotifyVehicleExit {
    uint64 character_id = 1;
}

message NotifyEntityUnload {
    uint64 id = 1;
}

message NotifyEntityMove {
    bool unreliable = 1000; // This is just a tag to indicate that this message is unreliable
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    uint64 tick = 4;
    float speed = 5;
    common.Vector3 full_rotation = 6;

    // Relayed verbatim from MoveEntityRequest: the mover's PlayerStateMachine
    // locomotion and upper-body states, so receivers animate what the sender is
    // actually doing rather than inferring it from measured speed alone.
    uint32 locomotion = 7;
    uint32 upper_body = 8;
}

message ChatMessage {
    string username = 1;
    string message = 2;

    // Which channel this was said on, so the client can colour it. Sent as a number the
    // SERVER decides rather than letting the client infer one from the text - otherwise
    // anyone could type "[yells]" and have their local chatter render as a shout.
    // 0 local, 1 yell, 2 whisper, 3 advert, 4 server notice.
    uint32 channel = 3;
}

// Move a player somewhere. Sent only to the player being moved.
//
// The client owns its own position, so the server cannot simply relocate someone by
// editing its own copy - the next position update would put them straight back. This
// asks the client to move itself, which is the only thing that actually works.
message NotifyTeleport {
    common.Vector3 position = 1;
    float rotation = 2;
}

// Tells a client to open the game's character creator.
//
// Server-driven on purpose: whether somebody needs a character is the server's business,
// since it is the only side that knows what they already have. A client that opened this
// for itself would be guessing.
message OpenCharacterCreator {
    // When true, do not open anything - just serialise the appearance the player has
    // right now and send it back.
    //
    // Two jobs in one message because they are two halves of the same exchange. The
    // creator gives no callback when it closes and there is no way to poll for it - there
    // is no IsActive on the customization system - so the player says when they are done
    // and this is what asks their client for the result.
    bool capture_only = 1;
}

// Asks a client what their character is called.
//
// Sent right after a character is saved without a name, which is what happens when
// somebody comes out of the creator - the creator has no name field of its own. Asking is
// the server's job for the same reason as above: it is the only side that knows whether a
// name already exists.
//
// The answer comes back as the ordinary /name command over chat rather than a message of
// its own. That path already validates, truncates and persists, so a second one would only
// be a second place for the two to disagree.
message RequestCharacterName {
    // What they are called now, so the box opens with something in it rather than empty.
    // Empty when they have never had a name.
    string current = 1;
}

message RpcCall {
    uint32 id = 1;
	bytes arguments = 2;
}

message RpcDefinition {
    uint32 id = 1;
    fixed64 klass = 2;
    fixed64 function = 3;
}

message RpcDefinitions {
    repeated RpcDefinition client_definitions = 1;
    repeated RpcDefinition server_definitions = 2;
}

// The server's metronome. Clock and weather come from the server, not each client's
// private singleplayer simulation - sent on join, on change, and re-asserted on an
// interval because the singleplayer brain drifts the clock and rolls its own weather
// given the chance. See docs/WORLD-STATE.md.
message NotifyWorldState {
    // Seconds of game time since midnight day 0 - the canonical server clock. It ticks
    // even when the server is empty, so the city has one continuous timeline.
    uint64 game_time_seconds = 1;

    // How many game-seconds pass per real second.
    float time_scale = 2;

    // CName hash (FNV1a64) of the worldWeatherState name, e.g. "24h_weather_rain".
    // 0 = leave the local sky on its natural cycle.
    uint64 weather_id = 3;

    // Blend time so weather rolls in rather than pops.
    float transition_seconds = 4;
}

// An interaction the server decided happened. Ask-don't-tell (docs/WORLD-STATE.md §4):
// clients REQUEST interactions, the server validates (existence, distance, state) and
// broadcasts the outcome - including to the actor, whose client plays it on receipt.
// No client can assert a world change; it can only ask for one.
message NotifyInteraction {
    // Server entity the interaction happened TO (a player's character, later a door
    // or container overlay entity).
    uint64 target_id = 1;

    // Who did it - so clients can play the right animation on the right puppet.
    uint64 actor_id = 2;

    // What happened. 1 = push. Extended as interactions are added; unknown values
    // must be ignored, not errored - older clients meeting newer interactions.
    uint64 interaction_id = 3;
}

// Somebody already in the world now looks different.
//
// The counterpart to NotifyCharacterLoad, which only ever fires at spawn. Without this a
// player who changed clothes kept wearing whatever they arrived in on every other screen,
// and a character whose appearance arrived late - a spawn that beat its own customization
// state - stayed faceless until everyone watching rejoined.
//
// Deliberately its own message rather than a field on movement: appearance changes a few
// times an hour and the blob is 9KB, while movement goes out thirty times a second.
message NotifyAppearanceUpdate {
    // The puppet this is about, in the server's ids - the same id NotifyCharacterLoad used,
    // so the receiving client already has an entity registered under it.
    uint64 id = 1;

    repeated uint64 equipment = 2;

    // Empty when only the clothing changed, which is the common case. The receiving client
    // keeps the customization it already has rather than clearing a face because a jacket
    // moved.
    bytes ccstate = 3;
}

// The account's characters changed - one was deleted, or one was created.
//
// The same list AuthenticationResponse carries, sent again when it stops being true. The
// selector redraws from this rather than assuming what a delete did: the server is the one
// that knows whether it actually happened, and a client that assumed success would offer
// PLAY on a character that no longer exists.
message NotifyCharacterList {
    repeated CharacterSummary characters = 1;

    // Said out loud when something was refused, so the selector can show a reason instead
    // of appearing to ignore the button. Empty on success.
    string error = 2;
}

// A quickhack put a status effect on somebody - blindness, a weapon glitch, crippled
// movement.
//
// Sent to everyone who can see the target, INCLUDING the target, who is the one person it
// actually has to reach: the effect was applied to their puppet on somebody else's machine,
// and until this arrives their own game has no idea. Their client applies it to their real
// player, which is the only place it can do anything.
message NotifyStatusEffect {
    uint64 target_id = 1;
    uint64 source_id = 2;
    uint64 effect_id = 3;
    uint32 stacks = 4;
}

// Somebody near you fired, reloaded, or changed weapon.
//
// The presentation half of combat: muzzle flash, firing animation, reload animation, the
// right weapon appearing in the right hand. Sent to everyone who can see the shooter,
// INCLUDING the shooter - their own client predicted it locally, and the echo is what
// confirms the server agreed.
//
// Notably this does NOT say whether anything was hit. That is NotifyDamageResult's job, and
// keeping them apart is deliberate: a client that decided hits from watching muzzle flashes
// would reach a different answer from the server, which is the whole class of bug this
// architecture exists to prevent.
message NotifyWeaponEvent {
    // The shooter's puppet.
    uint64 id = 1;

    uint32 kind = 2;
    uint64 weapon_id = 3;

    // Authoritative, not the claim. This is the server's count.
    uint32 magazine_ammo = 4;

    common.Vector3 position = 5;
    common.Vector3 direction = 6;
}

// Your weapon, as the server understands it.
//
// Sent only to the owner, and only when the server's count and theirs disagree - on a
// refused fire, a refused reload, or a correction after packet loss. Everyone else learns
// about ammo through NotifyWeaponEvent, because ammo is only interesting to the person
// holding the gun.
message NotifyWeaponState {
    uint64 weapon_id = 1;
    uint32 magazine_ammo = 2;
    uint32 reserve_ammo = 3;
}

// What actually happened, decided here.
//
// Sent to the attacker, the target, and everyone close enough to see it - so all three
// render the same event rather than each deciding independently. That is the whole point:
// a hit reaction, a blood effect and a health bar that disagree are three symptoms of the
// same missing message.
//
// This is NOT a health broadcast. Health after the hit is included so nobody has to
// accumulate their own running total, but the EVENT is the payload - who hit whom, with
// what, where, and how hard. Replicating only health would leave every client to invent
// its own reason for the number changing.
message NotifyDamageResult {
    // Echoes CombatEventRequest.event_id back to the attacker, so a client can retire the
    // prediction it made when it fired.
    uint64 event_id = 1;

    uint64 attacker_id = 2;
    uint64 target_id = 3;

    uint32 source_type = 4;
    uint32 damage_type = 5;
    uint32 hit_zone = 6;

    // What was asked for, and what the server allowed. Both, because they differ whenever
    // mitigation or a clamp applied, and a client that only sees the final number cannot
    // show armour doing its job.
    float raw_damage = 7;
    float final_damage = 8;

    float target_health_after = 9;
    float target_max_health = 10;

    bool critical = 11;
    bool headshot = 12;

    // The two outcomes that change what a client must do rather than just draw.
    bool killed = 13;
    bool knocked_down = 14;

    common.Vector3 hit_position = 15;
    common.Vector3 hit_direction = 16;
}

// Somebody's health or life state changed without a hit causing it - a spawn, a revive, a
// heal, or a correction after the server and a client disagreed.
//
// Separate from NotifyDamageResult on purpose. A damage result is an EVENT and should be
// rendered with reactions and effects; this is a STATE and should be applied quietly. Using
// one message for both is how a player ends up playing a hit reaction because they
// respawned.
message NotifyCombatState {
    uint64 id = 1;

    float health = 2;
    float max_health = 3;

    // 0 alive, 1 downed, 2 dead, 3 reviving. The brief's section 25 - and the reason the
    // client's Immortal flag can eventually be retired: being downed becomes a state the
    // server owns rather than a death the client has to prevent.
    uint32 life_state = 4;
}

// Somebody near you said something.
//
// The server relays frames verbatim - it never decodes them. That keeps the mixing cost on
// the machines doing the listening and means a codec change does not need a server rebuild,
// but it also means the server cannot inspect what is being said. Range is enforced by
// choosing who gets the frame, which is the only decision worth making centrally.
//
// The id is the SPEAKER's remote player id, so the receiver can place the sound at their
// puppet and show who is talking.
message NotifyVoiceFrame {
    bool unreliable = 1000; // This is just a tag to indicate that this message is unreliable
    uint64 id = 1;
    bytes data = 2;
    uint32 sequence = 3;
}

message Protocol {
    oneof content {
        AuthenticationResponse authentication_response = 1;
        NotifyCharacterLoad notify_character_load = 2;
        NotifyEntityUnload notify_character_unload = 3;
        SpawnCharacterResponse spawn_character_response = 4;
        NotifyEntityMove notify_character_move = 5;
        ChatMessage chat_message = 6;
        RpcCall rpc_call = 7;
        RpcDefinitions rpc_definitions = 8;
        NotifyVehicleLoad notify_vehicle_load = 9;
        NotifyVehicleEnter notify_vehicle_enter = 10;
        NotifyVehicleExit notify_vehicle_exit = 11;
        NotifyVehicleControlAssigned notify_vehicle_control_assigned = 12;
        NotifyTeleport notify_teleport = 13;
        OpenCharacterCreator open_character_creator = 14;
        RequestCharacterName request_character_name = 15;
        NotifyAuthorityAssigned notify_authority_assigned = 16;
        NotifyAuthorityRevoked notify_authority_revoked = 17;
        NotifyWorldState notify_world_state = 18;
        NotifyInteraction notify_interaction = 19;
        NotifyMoney notify_money = 20;
        NotifyQuestSkip notify_quest_skip = 21;
        NotifyAppearanceUpdate notify_appearance_update = 22;
        NotifyCharacterList notify_character_list = 23;
        NotifyVoiceFrame notify_voice_frame = 24;
        NotifyDamageResult notify_damage_result = 25;
        NotifyCombatState notify_combat_state = 26;
        NotifyWeaponEvent notify_weapon_event = 27;
        NotifyWeaponState notify_weapon_state = 28;
        NotifyStatusEffect notify_status_effect = 29;
    }
}