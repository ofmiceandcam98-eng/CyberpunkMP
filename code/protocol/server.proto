syntax = "proto3";

package server;

import "common.proto";

message Settings {
    uint32 update_rate = 1;
}

message AuthenticationResponse {
    bool success = 1;
    string error = 2;
    Settings settings = 3;
}

message SpawnCharacterResponse{
    uint64 id = 1;
    uint64 cookie = 2;
}

message NotifyCharacterLoad {
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    bool is_player = 4;
    // Raw TweakDBIDs - see the matching field in client.proto for why these are not names.
    repeated uint64 equipment = 5;
    bytes ccstate = 6;

    // Who this is.
    //
    // Without it the client has no idea, and the nameplate falls back to whatever the
    // TweakDB record it was built from is called - which is why every remote player
    // showed up as "Panam". The server is the only thing that knows the real name, since
    // it is the half that talked to Discord.
    string username = 7;
}

message NotifyVehicleLoad {
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    uint64 tweak_id = 4;
}

message NotifyVehicleControlAssigned {
    uint64 vehicle_id = 1;
}

message NotifyVehicleEnter {
    uint64 vehicle_id = 1;
    uint64 character_id = 2;
    uint64 sit_id = 3;
}

message NotifyVehicleExit {
    uint64 character_id = 1;
}

message NotifyEntityUnload {
    uint64 id = 1;
}

message NotifyEntityMove {
    bool unreliable = 1000; // This is just a tag to indicate that this message is unreliable
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    uint64 tick = 4;
    float speed = 5;
    common.Vector3 full_rotation = 6;
}

message ChatMessage {
    string username = 1;
    string message = 2;

    // Which channel this was said on, so the client can colour it. Sent as a number the
    // SERVER decides rather than letting the client infer one from the text - otherwise
    // anyone could type "[yells]" and have their local chatter render as a shout.
    // 0 local, 1 yell, 2 whisper, 3 advert, 4 server notice.
    uint32 channel = 3;
}

// Move a player somewhere. Sent only to the player being moved.
//
// The client owns its own position, so the server cannot simply relocate someone by
// editing its own copy - the next position update would put them straight back. This
// asks the client to move itself, which is the only thing that actually works.
message NotifyTeleport {
    common.Vector3 position = 1;
    float rotation = 2;
}

// Tells a client to open the game's character creator.
//
// Server-driven on purpose: whether somebody needs a character is the server's business,
// since it is the only side that knows what they already have. A client that opened this
// for itself would be guessing.
message OpenCharacterCreator {
    // When true, do not open anything - just serialise the appearance the player has
    // right now and send it back.
    //
    // Two jobs in one message because they are two halves of the same exchange. The
    // creator gives no callback when it closes and there is no way to poll for it - there
    // is no IsActive on the customization system - so the player says when they are done
    // and this is what asks their client for the result.
    bool capture_only = 1;
}

message RpcCall {
    uint32 id = 1;
	bytes arguments = 2;
}

message RpcDefinition {
    uint32 id = 1;
    fixed64 klass = 2;
    fixed64 function = 3;
}

message RpcDefinitions {
    repeated RpcDefinition client_definitions = 1;
    repeated RpcDefinition server_definitions = 2;
}

message Protocol {
    oneof content {
        AuthenticationResponse authentication_response = 1;
        NotifyCharacterLoad notify_character_load = 2;
        NotifyEntityUnload notify_character_unload = 3;
        SpawnCharacterResponse spawn_character_response = 4;
        NotifyEntityMove notify_character_move = 5;
        ChatMessage chat_message = 6;
        RpcCall rpc_call = 7;
        RpcDefinitions rpc_definitions = 8;
        NotifyVehicleLoad notify_vehicle_load = 9;
        NotifyVehicleEnter notify_vehicle_enter = 10;
        NotifyVehicleExit notify_vehicle_exit = 11;
        NotifyVehicleControlAssigned notify_vehicle_control_assigned = 12;
        NotifyTeleport notify_teleport = 13;
        OpenCharacterCreator open_character_creator = 14;
    }
}